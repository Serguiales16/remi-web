name: remi-web

services:
  remi-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: remi-web:latest
    container_name: remi-web
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
